name: Build VICTORIA Logistics ERP APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and validate VICTORIA Logistics ERP
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install dependencies
        run: npm ci

      - name: 5. Type-check application
        run: npm run lint

      - name: 6. Build web application and sync assets
        run: |
          npm run build
          test -f app/src/main/assets/www/index.html
          test -d app/src/main/assets/www/assets
          ASSET_COUNT=$(find app/src/main/assets/www/assets -maxdepth 1 -type f | wc -l)
          echo "Bundled web assets count: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -lt 2 ]; then
            echo "ERROR: asset bundle appears incomplete."
            exit 1
          fi

      - name: 7. Run central server integration tests
        env:
          JWT_SECRET: integration-test-only-secret-is-not-used-for-production
          OWNER_SETUP_KEY: integration-test-only-owner-setup-key
        run: npm run test:central-server

      - name: 8. Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 9. Validate Android project resources
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/drawable/ic_ejaz_launcher.xml
          grep -q 'android:icon="@drawable/ic_ejaz_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'VICTORIA Logistics ERP' app/src/main/res/values/strings.xml

      - name: 10. Build Debug APK for testing
        run: gradle assembleDebug --stacktrace

      - name: 11. Validate Debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 2000000
          unzip -t "$APK" >/dev/null
          mkdir -p handoff
          cp "$APK" "handoff/VICTORIA-Logistics-ERP-v1.2.0-DEBUG-TEST-ONLY.apk"
          sha256sum "handoff/VICTORIA-Logistics-ERP-v1.2.0-DEBUG-TEST-ONLY.apk" | tee handoff/DEBUG-SHA256.txt

      - name: 12. Upload Debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: VICTORIA-Logistics-ERP-DEBUG-TEST-ONLY-v1.2.0
          path: handoff/*
          if-no-files-found: error
          retention-days: 30

      - name: 13. Package central server
        run: |
          SERVER_ZIP="$GITHUB_WORKSPACE/VICTORIA-Logistics-ERP-Central-Server-v1.2.0.zip"
          STAGE="$RUNNER_TEMP/central-server-package"
          mkdir -p "$STAGE"
          rsync -a             --exclude ".git/"             --exclude "node_modules/"             --exclude "app/build/"             --exclude "data/"             --exclude ".env"             --exclude "VICTORIA-Logistics-ERP-Central-Server-v1.2.0.zip"             ./ "$STAGE/"
          (cd "$STAGE" && zip -qr "$SERVER_ZIP" .)
          test -s "$SERVER_ZIP"
          unzip -t "$SERVER_ZIP" >/dev/null
          unzip -l "$SERVER_ZIP" | grep -q "setup-central-server.ps1"
          unzip -l "$SERVER_ZIP" | grep -q "src/server/serverMain.ts"

      - name: 14. Upload central server package
        uses: actions/upload-artifact@v4
        with:
          name: VICTORIA-Logistics-ERP-Central-Server-v1.2.0
          path: VICTORIA-Logistics-ERP-Central-Server-v1.2.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: 15. Decode private release keystore
        if: env.HAS_RELEASE_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/victoria-release.keystore"
          test -s "$RUNNER_TEMP/victoria-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/victoria-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/victoria-release.keystore" >> "$GITHUB_OUTPUT"
        id: keystore

      - name: 16. Build signed Release APK
        if: env.HAS_RELEASE_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 2000000
          unzip -t "$APK" >/dev/null
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          mkdir -p release-handoff
          cp "$APK" "release-handoff/VICTORIA-Logistics-ERP-v1.2.0-RELEASE-SIGNED.apk"
          sha256sum "release-handoff/VICTORIA-Logistics-ERP-v1.2.0-RELEASE-SIGNED.apk" | tee release-handoff/RELEASE-SHA256.txt

      - name: 17. Upload signed Release APK
        if: env.HAS_RELEASE_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VICTORIA-Logistics-ERP-RELEASE-SIGNED-v1.2.0
          path: release-handoff/*
          if-no-files-found: error
          retention-days: 90

      - name: 18. Publish GitHub Release only when production signing is configured
        if: env.HAS_RELEASE_SECRETS == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.0-release-b${{ github.run_number }}"
          name: "VICTORIA Logistics ERP v1.2.0 — Signed Release"
          body: |
            VICTORIA Logistics ERP for مؤسسة إيجاز للنقليات.
            This release was built with the configured private Android release-signing secrets.
            Please complete the physical-device acceptance checklist before operational use.
          files: |
            release-handoff/VICTORIA-Logistics-ERP-v1.2.0-RELEASE-SIGNED.apk
            release-handoff/RELEASE-SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 19. Explain why signed release was skipped
        if: env.HAS_RELEASE_SECRETS != 'true'
        run: |
          echo "::notice::Debug test APK and server package were built. A signed production APK was not created because one or more Android signing secrets are not configured."
