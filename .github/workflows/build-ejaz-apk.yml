name: Build VICTORIA Logistics ERP APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Complete VICTORIA Logistics ERP APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Java 17 Development Kit (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Set up Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install dependencies deterministically
        run: npm ci

      - name: 5. Type-check application
        run: npm run lint

      - name: 6. Compile full web application and sync assets
        run: |
          npm run build
          test -f app/src/main/assets/www/index.html
          test -d app/src/main/assets/www/assets
          ASSET_COUNT=$(find app/src/main/assets/www/assets -maxdepth 1 -type f | wc -l)
          echo "Bundled web assets count: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -lt 2 ]; then
            echo "CRITICAL: Asset bundle appears incomplete."
            exit 1
          fi

      - name: 7. Set up Gradle 8.2 Toolchain
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 8. Validate Android project and launcher resources
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/drawable/ic_ejaz_launcher.xml
          grep -q 'android:icon="@drawable/ic_ejaz_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'VICTORIA Logistics ERP' app/src/main/res/values/strings.xml
          echo "Android launcher branding and resources verified."

      - name: 9. Build Debug APK with full stacktrace
        run: gradle assembleDebug --stacktrace --info

      - name: 10. Inspect APK integrity and verify size threshold
        run: |
          RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RAW_APK"
          APK_SIZE_BYTES=$(stat -c%s "$RAW_APK")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE_BYTES / 1048576}")
          echo "APK: $RAW_APK"
          echo "Size: $APK_SIZE_BYTES bytes ($APK_SIZE_MB MB)"
          if [ "$APK_SIZE_BYTES" -lt 2000000 ]; then
            echo "ERROR: APK is abnormally small."
            exit 1
          fi
          unzip -t "$RAW_APK" >/dev/null
          echo "APK ZIP integrity verified."

      - name: 11. Prepare versioned APK artifact name
        id: prep
        run: |
          VERSION="1.2.0"
          RUN_NUM="${{ github.run_number }}"
          TIMESTAMP=$(date +'%Y%m%d')
          FINAL_NAME="VICTORIA-Logistics-ERP-v${VERSION}-b${RUN_NUM}-${TIMESTAMP}.apk"
          cp "$PWD/app/build/outputs/apk/debug/app-debug.apk" "$PWD/app/build/outputs/apk/debug/${FINAL_NAME}"
          echo "apk_filename=${FINAL_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 12. Upload Complete APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VICTORIA-Logistics-ERP-APK-v1.2.0
          path: app/build/outputs/apk/debug/VICTORIA-Logistics-ERP-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13. Package local central server for handoff
        run: |
          SERVER_ZIP="$PWD/VICTORIA-Logistics-ERP-Central-Server-v1.2.0.zip"
          zip -r "$SERVER_ZIP" . \
            -x "./.git/*" \
               "./node_modules/*" \
               "./app/build/*" \
               "./data/*" \
               "./.env"
          test -s "$SERVER_ZIP"
          echo "Central server package created: $SERVER_ZIP"

      - name: 14. Upload local central server package
        uses: actions/upload-artifact@v4
        with:
          name: VICTORIA-Logistics-ERP-Central-Server-v1.2.0
          path: VICTORIA-Logistics-ERP-Central-Server-v1.2.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: 15. Create GitHub Release with APK on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.0-b${{ github.run_number }}"
          name: "VICTORIA Logistics ERP v1.2.0 (Build ${{ github.run_number }})"
          body: |
            ## VICTORIA Logistics ERP — الإصدار الرسمي

            - **الاسم الخارجي:** VICTORIA Logistics ERP
            - **العميل:** مؤسسة إيجاز للنقليات
            - **الإصدار:** v1.2.0
            - **versionCode:** 3
            - **applicationId:** `sa.ejaz.transport`
            - **Launcher:** أيقونة Vector نظيفة بدون زوايا بيضاء
            - **Splash:** شاشة افتتاحية متحركة احترافية
          files: app/build/outputs/apk/debug/${{ steps.prep.outputs.apk_filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
