name: Build Victoria Logistics ERP APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Complete Victoria Logistics ERP APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Java 17 Development Kit (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Set up Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install dependencies deterministically
        run: |
          echo "Installing NPM dependencies..."
          npm ci

      - name: 5. Compile full web application and sync assets
        run: |
          echo "Building complete React/Tailwind web application..."
          npm run build
          
          # Rigorous verification that web assets exist
          test -f app/src/main/assets/www/index.html || { echo "CRITICAL: app/src/main/assets/www/index.html is missing!"; exit 1; }
          test -d app/src/main/assets/www/assets || { echo "CRITICAL: app/src/main/assets/www/assets is missing!"; exit 1; }
          
          ASSET_COUNT=$(ls -1 app/src/main/assets/www/assets/ | wc -l)
          echo "Bundled web assets count: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -lt 2 ]; then
            echo "CRITICAL: Asset bundle appears incomplete or truncated!"
            exit 1
          fi

      - name: 6. Set up Gradle 8.2 Toolchain
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 7. Validate Android project files & Resource signatures
        run: |
          test -f settings.gradle.kts || { echo "Missing settings.gradle.kts"; exit 1; }
          test -f app/build.gradle.kts || { echo "Missing app/build.gradle.kts"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "Missing AndroidManifest.xml"; exit 1; }
          test -f app/src/main/res/values/strings.xml || { echo "Missing strings.xml"; exit 1; }
          
          # Verify every launcher icon has genuine PNG signature (89 50 4E 47)
          echo "Validating PNG headers for all mipmap icons..."
          for icon in app/src/main/res/mipmap-*/ic_launcher*.png; do
            if [ -f "$icon" ]; then
              SIG=$(head -c 4 "$icon" | od -An -tx1 | tr -d ' \n')
              if [ "$SIG" != "89504e47" ]; then
                echo "CRITICAL: Corrupt icon format in $icon (Signature: $SIG, expected 89504e47)"
                exit 1
              fi
            fi
          done
          echo "All Android resources and XML files verified successfully."

      - name: 8. Build Debug APK with full stacktrace
        run: |
          echo "Starting Gradle assembleDebug build..."
          gradle assembleDebug --stacktrace --info

      - name: 9. Inspect APK integrity & verify size threshold
        run: |
          echo "Listing compiled APK outputs:"
          ls -lh app/build/outputs/apk/debug/
          
          RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RAW_APK" || { echo "CRITICAL: app-debug.apk was not generated!"; exit 1; }
          
          APK_SIZE_BYTES=$(stat -c%s "$RAW_APK")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE_BYTES / 1048576}")
          echo "=========================================================="
          echo "SUCCESSFUL APK BUILD VERIFIED"
          echo "File: $RAW_APK"
          echo "Size: $APK_SIZE_BYTES bytes ($APK_SIZE_MB MB)"
          echo "=========================================================="
          
          # Guard against truncated/empty APK (< 2.0 MB indicates assets were excluded)
          if [ "$APK_SIZE_BYTES" -lt 2000000 ]; then
            echo "ERROR: APK is abnormally small (< 2.0MB)! Full web assets were likely omitted."
            exit 1
          fi

      - name: 10. Prepare versioned APK artifact name
        id: prep
        run: |
          VERSION="1.1.0"
          RUN_NUM="${{ github.run_number }}"
          TIMESTAMP=$(date +'%Y%m%d')
          FINAL_NAME="VICTORIA-Logistics-ERP-v${VERSION}-b${RUN_NUM}-${TIMESTAMP}.apk"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/${FINAL_NAME}"
          echo "apk_filename=${FINAL_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_num=${RUN_NUM}" >> $GITHUB_OUTPUT

      - name: 11. Upload Complete APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VICTORIA-Logistics-ERP-APK-v1.1.0
          path: app/build/outputs/apk/debug/VICTORIA-Logistics-ERP-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 12. Create GitHub Release with APK on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.0-b${{ github.run_number }}"
          name: "VICTORIA Logistics ERP v1.1.0 (Build ${{ github.run_number }})"
          body: |
            ## 🚀 VICTORIA Logistics ERP — النسخة الكاملة الرسمية
            
            - **اسم النظام الرسمي**: VICTORIA Logistics ERP
            - **القطاع التشغيلي**: قطاع إيجـاز للنقليات (EJAZ Transport Module)
            - **رقم الإصدار**: v1.1.0
            - **versionCode**: 2 (يدعم التثبيت المباشر فوق الإصدارات السابقة)
            - **معرّف الحزمة (applicationId)**: `sa.ejaz.transport`
            - **تاريخ البناء**: ${{ steps.prep.outputs.build_num }}
            
            ### ✨ محتويات النسخة:
            - النظام الإداري والتشغيلي المكتمل لكافة الأقسام (الرحلات، السائقين، الشاحنات، العملاء، الصيانة، المالية، التقارير، السجلات، تسليم العهد).
            - دعم التخزين الدائم غير المحدود (IndexedDB / Persistent Storage).
            - جاهزية المزامنة المركزية مع خادم المؤسسة.
            - حماية التوقيع المتوافق للحفاظ على بيانات الجهاز عند التحديث.
          files: app/build/outputs/apk/debug/${{ steps.prep.outputs.apk_filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
