<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle accent ring -->
  <circle cx="256" cy="256" r="210" stroke="#334155" stroke-width="6" fill="none" opacity="0.4"/>
  
  <!-- Stylized Truck Icon -->
  <g transform="translate(100, 140) scale(0.62)">
    <!-- Truck Trailer Box -->
    <rect x="20" y="40" width="280" height="200" rx="16" fill="url(#orangeGrad)"/>
    <!-- Speed Lines on Trailer -->
    <path d="M50 80 L160 80 M50 120 L210 120 M50 160 L140 160" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Truck Cabin -->
    <path d="M310 100 L390 100 Q430 100 450 140 L480 200 Q490 220 490 240 L310 240 Z" fill="#FFFFFF"/>
    <!-- Cabin Window -->
    <path d="M340 120 L400 120 Q420 120 435 150 L450 180 L340 180 Z" fill="#0F172A"/>
    
    <!-- Wheels -->
    <!-- Back Wheel 1 -->
    <circle cx="100" cy="250" r="45" fill="#0F172A" stroke="#EA580C" stroke-width="10"/>
    <circle cx="100" cy="250" r="18" fill="#CBD5E1"/>
    <!-- Back Wheel 2 -->
    <circle cx="210" cy="250" r="45" fill="#0F172A" stroke="#EA580C" stroke-width="10"/>
    <circle cx="210" cy="250" r="18" fill="#CBD5E1"/>
    <!-- Front Wheel -->
    <circle cx="410" cy="250" r="45" fill="#0F172A" stroke="#EA580C" stroke-width="10"/>
    <circle cx="410" cy="250" r="18" fill="#CBD5E1"/>
  </g>
  
  <!-- Brand text under icon -->
  <text x="256" y="430" font-family="'Cairo', 'Tajawal', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">إيجاز للنقليات</text>
  <text x="256" y="465" font-family="sans-serif" font-size="20" font-weight="700" fill="#FB923C" text-anchor="middle" letter-spacing="4">EJAZ TRANSPORT</text>
</svg>
